<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Link</title>

<style>
body{
    font-family: Arial, sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background: linear-gradient(135deg, #87CEEB, #4FC3F7);
}

h2{
    margin-bottom:25px;
    color:#ffffff;
    font-size:30px;
    text-align:center;
    text-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.btn{
    background:#22C55E;
    color:white;
    padding:14px 35px;
    border-radius:10px;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.btn:hover{
    background:#16A34A;
    transform:translateY(-2px);
}
</style>
</head>
<body>

<h2>Do you want to enter the classroom?</h2>

<a href="https://sites.google.com/view/digitalworldallclass/all-class-list" target="_blank" class="btn">
    Open the Classroom Door
</a>

</body>
</html>
